name: Publicar o site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"      # a cada 3 horas: replica newsletter, podcast e vídeos
  workflow_dispatch:

# Padrão sem privilégio. Cada job pede só o que usa.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  replicar:
    # Único job que escreve no repositório. Ele lê texto de fora, então não recebe pages nem id-token.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: |
          python3 tests/testa_sincronizar.py
          python3 tests/testa_importar.py

      - name: Replicar newsletter, podcast e vídeos
        run: python3 ferramentas/sincronizar.py

      - name: Guardar o conteúdo replicado no repositório
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "Conteúdo replicado das fontes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  gerar:
    # Gera o site e envia o pacote. Separado do deploy, como no modelo oficial do GitHub Pages:
    # quando os dois ficavam no mesmo job, o deploy às vezes não achava o pacote recém-enviado.
    needs: replicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # pega também o conteúdo que o job anterior acabou de gravar
          persist-credentials: false

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true

      - name: Gerar o site
        run: hugo --minify --gc

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
