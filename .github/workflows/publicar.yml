name: Publicar o site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"      # a cada 3 horas: replica newsletter, podcast e vídeos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replicar newsletter, podcast e vídeos
        run: |
          pip install pyyaml
          python3 ferramentas/sincronizar.py

      - name: Guardar o conteúdo replicado no repositório
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Conteúdo replicado das fontes" && git push)

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true

      - name: Gerar o site
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
