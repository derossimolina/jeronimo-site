baseURL = "https://jeronimo.caxias.br/"
title = "jeronimo molina"
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false
copyright = "© 2026 J. de Rossi Molina Ltda"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "America/Sao_Paulo"

[pagination]
  pagerSize = 12

[languages]
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 1
    [languages.pt.params]
      description = "Análise política com fato, fonte e posição. Newsletter, podcast e vídeos de Jerônimo de Rossi Molina."
      tagline = "Análise política com fato, fonte e posição."
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
    [languages.en.params]
      description = "Political analysis with fact, source and a declared position. Newsletter, podcast and videos by Jerônimo de Rossi Molina."
      tagline = "Political analysis with fact, source and position."

[params]
  newsletter = "https://jeronimomolina.substack.com"
  spotifyShow = "0DifYuIonPXjgYYRpenHM8"

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[permalinks.page]
  analises = "/analises/:slug/"
  newsletter = "/newsletter/:slug/"
  podcast = "/podcast/:slug/"
  videos = "/videos/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"

[minify]
  minifyOutput = true

